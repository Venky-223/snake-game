<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snake Game v2</title>
<style>
  :root { --snake: #32cd32; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 16px;
    background: radial-gradient(circle at top, #263238, #090b0d 70%);
    color: #fff;
    font-family: Arial, sans-serif;
  }
  .game-container {
    width: min(94vw, 560px);
    text-align: center;
  }
  h1 { margin: 0 0 8px; font-size: clamp(1.8rem, 6vw, 2.6rem); }
  #score { font-size: clamp(1rem, 4vw, 1.25rem); margin-bottom: 12px; }
  .board-wrap {
    width: 100%;
    aspect-ratio: 1 / 1;
    max-width: 560px;
    margin: auto;
    position: relative;
  }
  canvas {
    width: 100%;
    height: 100%;
    display: block;
    border: 3px solid #eee;
    border-radius: 12px;
    background: #111820;
    touch-action: none;
  }
  #status {
    min-height: 24px;
    margin: 10px 0;
    font-weight: bold;
  }
  .controls {
    display: flex;
    gap: 10px;
    justify-content: center;
    flex-wrap: wrap;
  }
  button {
    border: 0;
    border-radius: 9px;
    padding: 12px 20px;
    min-width: 140px;
    font-size: 1rem;
    font-weight: bold;
    cursor: pointer;
  }
  button:active { transform: scale(.97); }

  .mobile-controls {
    display: none;
    margin: 14px auto 0;
    width: min(220px, 70vw);
    grid-template-columns: repeat(3, 1fr);
    gap: 7px;
  }
  .mobile-controls button { min-width: 0; padding: 12px; }
  .up { grid-column: 2; }
  .left { grid-column: 1; grid-row: 2; }
  .down { grid-column: 2; grid-row: 2; }
  .right { grid-column: 3; grid-row: 2; }

  @media (max-width: 700px) {
    .mobile-controls { display: grid; }
    .controls button { flex: 1 1 42%; min-width: 0; }
  }
  @media (max-width: 380px) {
    body { padding: 10px; }
    button { padding: 10px 12px; }
  }
</style>
</head>
<body>
<main class="game-container">
  <h1>🐍 Snake Game v2</h1>
  <div id="score">Score: 0 | Eggs: 0/5</div>

  <div class="board-wrap">
    <canvas id="gameCanvas" width="600" height="600"></canvas>
  </div>

  <div id="status">Eat 5 eggs to change your snake color!</div>

  <div class="controls">
    <button id="restartBtn">Restart Game</button>
    <button id="pauseBtn">Pause Game</button>
  </div>

  <div class="mobile-controls" aria-label="Touch controls">
    <button class="up" data-direction="UP">▲</button>
    <button class="left" data-direction="LEFT">◀</button>
    <button class="down" data-direction="DOWN">▼</button>
    <button class="right" data-direction="RIGHT">▶</button>
  </div>
</main>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");
const scoreEl = document.getElementById("score");
const statusEl = document.getElementById("status");
const pauseBtn = document.getElementById("pauseBtn");

const GRID = 30;
const CELL = canvas.width / GRID;
const SPEED = 105;
const COLORS = ["#32cd32", "#ffd21f", "#00d9ff", "#ff5c8a", "#b56cff", "#ff8c42"];

let snake, food, direction, nextDirection, score, eggsSinceColor, colorIndex;
let paused, gameOver, timer;

function startGame() {
  snake = [
    {x: 15, y: 15},
    {x: 14, y: 15},
    {x: 13, y: 15}
  ];
  direction = "RIGHT";
  nextDirection = "RIGHT";
  score = 0;
  eggsSinceColor = 0;
  colorIndex = 0;
  paused = false;
  gameOver = false;
  pauseBtn.textContent = "Pause Game";
  statusEl.textContent = "Eat 5 eggs to change your snake color!";
  placeFood();
  clearInterval(timer);
  timer = setInterval(tick, SPEED);
  draw();
}

function placeFood() {
  do {
    food = {
      x: Math.floor(Math.random() * GRID),
      y: Math.floor(Math.random() * GRID)
    };
  } while (snake.some(p => p.x === food.x && p.y === food.y));
}

function tick() {
  if (paused || gameOver) return;

  direction = nextDirection;
  const head = {...snake[0]};

  if (direction === "UP") head.y--;
  if (direction === "DOWN") head.y++;
  if (direction === "LEFT") head.x--;
  if (direction === "RIGHT") head.x++;

  const hitWall = head.x < 0 || head.x >= GRID || head.y < 0 || head.y >= GRID;
  const hitSelf = snake.some(p => p.x === head.x && p.y === head.y);

  if (hitWall || hitSelf) {
    gameOver = true;
    statusEl.textContent = `Game Over! Final score: ${score}`;
    draw();
    return;
  }

  snake.unshift(head);

  if (head.x === food.x && head.y === food.y) {
    score++;
    eggsSinceColor++;

    if (eggsSinceColor === 5) {
      eggsSinceColor = 0;
      colorIndex = (colorIndex + 1) % COLORS.length;
      statusEl.textContent = "🎉 5 eggs eaten! Snake color changed!";
    } else {
      statusEl.textContent = `Egg eaten! ${5 - eggsSinceColor} more for a color change.`;
    }

    placeFood();
  } else {
    snake.pop();
  }

  updateScore();
  draw();
}

function updateScore() {
  scoreEl.textContent = `Score: ${score} | Eggs: ${eggsSinceColor}/5`;
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // Board
  ctx.fillStyle = "#111820";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Subtle grid
  ctx.strokeStyle = "rgba(255,255,255,.035)";
  ctx.lineWidth = 1;
  for (let i = 1; i < GRID; i++) {
    const p = i * CELL;
    ctx.beginPath(); ctx.moveTo(p, 0); ctx.lineTo(p, canvas.height); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, p); ctx.lineTo(canvas.width, p); ctx.stroke();
  }

  drawEgg(food.x * CELL + CELL / 2, food.y * CELL + CELL / 2);

  const snakeColor = COLORS[colorIndex];
  snake.forEach((part, index) => {
    const pad = 2;
    const x = part.x * CELL + pad;
    const y = part.y * CELL + pad;
    const size = CELL - pad * 2;

    ctx.fillStyle = snakeColor;
    ctx.strokeStyle = "rgba(0,0,0,.5)";
    ctx.lineWidth = 2;
    roundRect(ctx, x, y, size, size, Math.max(4, CELL * .18));
    ctx.fill();
    ctx.stroke();

    if (index === 0) {
      // Eyes
      ctx.fillStyle = "#111";
      const eye = Math.max(2, CELL * .08);
      ctx.beginPath();
      ctx.arc(x + size * .32, y + size * .32, eye, 0, Math.PI * 2);
      ctx.arc(x + size * .68, y + size * .32, eye, 0, Math.PI * 2);
      ctx.fill();
    }
  });

  if (paused) {
    overlay("PAUSED");
  } else if (gameOver) {
    overlay("GAME OVER");
  }
}

function drawEgg(cx, cy) {
  ctx.save();
  ctx.translate(cx, cy);

  // Shadow
  ctx.fillStyle = "rgba(0,0,0,.35)";
  ctx.beginPath();
  ctx.ellipse(2, CELL * .27, CELL * .28, CELL * .09, 0, 0, Math.PI * 2);
  ctx.fill();

  // Realistic egg-like shape with gradient
  const gradient = ctx.createRadialGradient(-CELL*.08, -CELL*.12, 1, 0, 0, CELL*.4);
  gradient.addColorStop(0, "#fffdf2");
  gradient.addColorStop(.55, "#f2e7c7");
  gradient.addColorStop(1, "#bda879");

  ctx.fillStyle = gradient;
  ctx.strokeStyle = "#806f4f";
  ctx.lineWidth = Math.max(1.5, CELL * .035);

  ctx.beginPath();
  ctx.moveTo(0, -CELL*.34);
  ctx.bezierCurveTo(CELL*.22, -CELL*.30, CELL*.30, -CELL*.02, CELL*.24, CELL*.20);
  ctx.bezierCurveTo(CELL*.18, CELL*.36, -CELL*.18, CELL*.36, -CELL*.24, CELL*.20);
  ctx.bezierCurveTo(-CELL*.30, -CELL*.02, -CELL*.22, -CELL*.30, 0, -CELL*.34);
  ctx.closePath();
  ctx.fill();
  ctx.stroke();

  // Small natural speckles
  ctx.fillStyle = "rgba(130,105,65,.25)";
  for (let i = 0; i < 8; i++) {
    const a = i * 2.4;
    ctx.beginPath();
    ctx.arc(Math.cos(a)*CELL*.13, Math.sin(a)*CELL*.20, Math.max(0.8, CELL*.015), 0, Math.PI*2);
    ctx.fill();
  }

  ctx.restore();
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}

function overlay(text) {
  ctx.fillStyle = "rgba(0,0,0,.58)";
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = "#fff";
  ctx.font = `bold ${Math.max(28, canvas.width*.08)}px Arial`;
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText(text, canvas.width/2, canvas.height/2);
}

function setDirection(newDirection) {
  const opposite = {
    UP: "DOWN", DOWN: "UP", LEFT: "RIGHT", RIGHT: "LEFT"
  };
  if (newDirection !== opposite[direction]) {
    nextDirection = newDirection;
  }
}

document.addEventListener("keydown", e => {
  const keys = {
    ArrowUp: "UP", w: "UP", W: "UP",
    ArrowDown: "DOWN", s: "DOWN", S: "DOWN",
    ArrowLeft: "LEFT", a: "LEFT", A: "LEFT",
    ArrowRight: "RIGHT", d: "RIGHT", D: "RIGHT"
  };
  if (keys[e.key]) {
    e.preventDefault();
    setDirection(keys[e.key]);
  }
  if (e.key === " " || e.key === "p" || e.key === "P") togglePause();
});

document.querySelectorAll("[data-direction]").forEach(btn => {
  btn.addEventListener("click", () => setDirection(btn.dataset.direction));
});

document.getElementById("restartBtn").addEventListener("click", startGame);

function togglePause() {
  if (gameOver) return;
  paused = !paused;
  pauseBtn.textContent = paused ? "Resume Game" : "Pause Game";
  statusEl.textContent = paused ? "Game paused." : "Game resumed.";
  draw();
}

pauseBtn.addEventListener("click", togglePause);

startGame();
</script>
</body>
</html>
